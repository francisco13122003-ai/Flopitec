name: Design review build

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    if: github.head_ref == 'design/oscuro-editorial-2026-10-14'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Package source and rendered pages for visual review
        run: |
          mkdir -p review
          git archive --format=tar HEAD | gzip > review/source.tar.gz
          tar -czf review/dist.tar.gz dist
      - uses: actions/upload-artifact@v4
        with:
          name: design-review-${{ github.event.pull_request.head.sha }}
          path: review/
          retention-days: 7
          if-no-files-found: error
